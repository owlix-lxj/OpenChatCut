log_format openchatcut_no_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name editor.daost.cn;
    access_log /var/log/nginx/editor.daost.cn.access.log openchatcut_no_query;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name editor.daost.cn;

    ssl_certificate     /etc/letsencrypt/live/daost.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daost.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20g;
    proxy_request_buffering off;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Launch tickets are query parameters. Never persist query strings here.
    access_log /var/log/nginx/editor.daost.cn.access.log openchatcut_no_query;
    error_log /var/log/nginx/editor.daost.cn.error.log;
}
