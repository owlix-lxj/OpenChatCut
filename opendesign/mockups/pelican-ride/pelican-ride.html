<head>
<meta charset="UTF-8">

<title>鹤引龙辇 · 南天门</title>
<style>
:root{color-scheme:dark;--paper:#112f35;--gold:#d8b77a;--ink:#f0e5cd;--muted:#93b0a8;--line:#bda27040}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
main{max-width:1600px;margin:auto;padding:27px 46px 24px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px}
.brand{display:flex;align-items:center;gap:13px;font-size:14px;letter-spacing:5px;color:var(--gold)}
.seal{display:grid;place-items:center;width:33px;height:37px;border:1px solid #de9d80;background:#963f35;color:#fae4c7;font-size:12px;letter-spacing:1px;line-height:1.1}
.edition{font-size:11px;color:var(--muted);letter-spacing:3px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 0 20px;gap:24px}
.eyebrow{font-size:10px;letter-spacing:5px;color:var(--gold);margin-bottom:10px}
h1{font-size:clamp(34px,4.8vw,66px);font-weight:400;letter-spacing:9px;margin:0}
h1 span{color:var(--gold)}
.intro p{font-size:12px;line-height:2;letter-spacing:3px;color:#b4c3b4;margin:0 0 5px}
.scene{position:relative;border:1px solid var(--line);padding:7px;background:#173a3f}
.scene::before,.scene::after{content:"";position:absolute;width:35px;height:35px;border-color:var(--gold);border-style:solid;pointer-events:none;z-index:1}
.scene::before{top:0;left:0;border-width:1px 0 0 1px}.scene::after{right:0;bottom:0;border-width:0 1px 1px 0}
#world{width:100%;display:block}
.controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 0;border-bottom:1px solid var(--line)}
.caption{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;color:#c9ceb5}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px #d8b77a66}
.actions{display:flex;align-items:center;gap:9px}
button{min-height:44px;background:#183b40;border:1px solid #a58f5e66;border-radius:2px;padding:0 18px;color:var(--ink);font:12px "Songti SC","STSong",serif;letter-spacing:2px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{background:#254b4b;border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.speed-control{display:flex;align-items:center;gap:12px;padding:0 13px;min-height:44px;border:1px solid #a58f5e66}
.speed-control label{font-size:12px;white-space:nowrap;letter-spacing:1px}
input[type="range"]{width:115px;accent-color:var(--gold);cursor:pointer;min-height:28px}
output{font:11px monospace;min-width:38px;color:var(--gold)}
footer{display:flex;justify-content:space-between;margin-top:17px;font-size:10px;color:var(--muted);letter-spacing:3px}
.line{stroke:#224344;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gold-line{fill:none;stroke:#d8b77a;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:700px){main{padding:18px 15px}.brand{font-size:12px;letter-spacing:2px}.edition{font-size:9px;letter-spacing:1px}.intro{padding-top:24px;display:block}.intro p{margin-top:14px;font-size:11px}.scene{padding:3px;margin:0 -10px}.controls{align-items:flex-start;flex-direction:column;gap:15px}.actions{width:100%;flex-wrap:wrap}.speed-control{flex:1;justify-content:space-between;order:3;flex-basis:100%}input[type="range"]{flex:1}button{flex:1}footer{letter-spacing:1px;font-size:9px}}
</style>
</head>

<g id="motes" fill="#f4dda0" opacity=".6"><circle cx="611" cy="457" r="2"/><circle cx="666" cy="492" r="1.5"/><circle cx="735" cy="548" r="2"/><circle cx="1118" cy="400" r="1.5"/><circle cx="989" cy="495" r="2"/><circle cx="235" cy="350" r="1.8"/><circle cx="1055" cy="563" r="1.5"/></g>
<g id="bell-rings" fill="none" stroke="#ffe2a2" opacity="0"><circle cx="399" cy="280" r="25"/><circle cx="399" cy="280" r="38"/></g>
<rect width="1400" height="760" fill="url(#paper)" pointer-events="none"/>
<g fill="#e3cf9f" font-family="STKaiti,KaiTi,Songti SC,serif" text-anchor="middle"><text x="1317" y="88" font-size="21" letter-spacing="5" writing-mode="vertical-rl">乘云气 · 御飞龙 · 游乎四海之外</text></g>
<g transform="translate(1299 416)"><rect width="33" height="41" rx="2" fill="#994536"/><text x="17" y="17" fill="#f0d6a1" font-size="12" text-anchor="middle">九霄<tspan x="17" dy="16">神游</tspan></text></g>
<path d="M21 57V21H57M1343 21H1379V57M21 703V739H57M1343 739H1379V703" fill="none" stroke="#d4c18d" opacity=".6"/>
</g>
</svg>
</div>
<div class="controls">
<div class="caption"><span class="dot" id="status-dot"></span><span id="status" aria-live="polite">仙鹤引驾 · 云海徐行</span></div>
<div class="actions">
<button id="toggle" type="button" aria-label="暂停动画">暂驻云端</button>
<div class="speed-control"><label for="speed">御风档位</label><input id="speed" type="range" min="1" max="10" step="1" value="1" aria-valuetext="1 档，1 倍速度"><output id="speed-label" for="speed">01/10</output></div>
<button id="bell" type="button" aria-label="鸣响仙铃">鸣响仙铃</button>
</div>
</div>
<footer><span>南天门外 · 云路迢迢</span><span>青绿设色 / 金碧天宫</span></footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let running=true, speed=1, elapsed=0, last=null, bellTime=-10000, audio;
  const layers=[
    {node:$('clouds-far'),span:1700,rate:12},
    {node:$('clouds-middle'),span:1750,rate:31},
    {node:$('clouds-near'),span:1900,rate:67}
  ];
  layers.forEach(layer => {
    layer.copy=layer.node.cloneNode(true);
    layer.copy.removeAttribute('id');
    layer.node.after(layer.copy);
  });
  const nodes=Object.fromEntries(['carriage','crane','wing-near','wing-far','rein-back','rein-front','ribbon','curtain','tassel-left','tassel-right','distant-cranes','motes','wind','bell-rings'].map(id=>[id,$(id)]));
  const set=(id,attribute,value)=>nodes[id].setAttribute(attribute,value);
  function status() {
    $('status').textContent=!running?'暂驻云端 · 静听天籁':speed===10?'扶摇九万里 · 十档御风':speed>=7?'长风万里 · 鹤越九霄':speed>=4?'仙鹤引驾 · 乘风凌霄':'仙鹤引驾 · 云海徐行';
    $('status-dot').style.opacity=running?'1':'.4';
  }
  function draw(t) {
    const beat=t*2.3;
    const craneY=Math.sin(beat)*7, carriageY=Math.sin(beat-.8)*4;
    set('crane','transform','translate(0 '+craneY+')');
    set('carriage','transform','translate(0 '+carriageY+')');
    set('wing-near','transform','rotate('+(Math.sin(beat)*19+5)+') scale(1 '+(.7+.3*Math.cos(beat))+')');
    set('wing-far','transform','rotate('+(-Math.sin(beat+.4)*17-8)+') scale(1 '+(.72+.28*Math.cos(beat+.4))+')');
    set('rein-back','d','M533 '+(484+carriageY)+'Q730 '+(487+(craneY+carriageY)/2)+' 915 '+(429+craneY));
    set('rein-front','d','M561 '+(522+carriageY)+'Q752 '+(529+(craneY+carriageY)/2)+' 918 '+(439+craneY));
    const flutter=Math.sin(t*4)*10;
    set('ribbon','d','M915 431Q867 '+(411+flutter)+' 829 430T751 '+(420-flutter)+'L768 '+(440-flutter)+'Q803 '+(452+flutter)+' 840 437T915 443Z');
    set('curtain','d','M-80-109Q-49-72 '+(-76+flutter*.3)+' 10L'+(-106+flutter*.4)+' 24Q-81-43-99-113Z');
    set('tassel-left','transform','translate(-110 -113) rotate('+(Math.sin(t*3)*8+8)+')');
    set('tassel-right','transform','translate(144 -113) rotate('+(Math.sin(t*3+.7)*7+8)+')');
    layers.forEach(layer => {
      const x=(t*layer.rate)%layer.span;
      layer.node.setAttribute('transform','translate('+(-x)+' 0)');
      layer.copy.setAttribute('transform','translate('+(layer.span-x)+' 0)');
    });
    set('distant-cranes','transform','translate('+Math.sin(t*.3)*18+' '+Math.sin(t*1.5)*5+')');
    set('motes','transform','translate('+(-t*19%210)+' '+Math.sin(t*.7)*16+')');
    set('motes','opacity',.35+.2*Math.sin(t*.8));
    set('wind','transform','translate('+(-t*24%100)+' 0)');
    set('wind','opacity',.25+.15*Math.sin(t*1.5));
  }
  function frame(now) {
    if(last!==null&&running) elapsed+=Math.min((now-last)/1000,.05)*speed;
    last=now;
    draw(elapsed);
    const age=(now-bellTime)/1000;
    set('bell-rings','opacity',age>=0&&age<1.8?(1-age/1.8)*.8:0);
    set('bell-rings','transform','translate(399 280) scale('+(1+Math.min(Math.max(age,0),1.8)*.6)+') translate(-399 -280)');
    requestAnimationFrame(frame);
  }
  $('toggle').addEventListener('click',()=>{
    running=!running;
    $('toggle').textContent=running?'暂驻云端':'继续御风';
    $('toggle').setAttribute('aria-label',running?'暂停动画':'播放动画');
    status();
  });
  $('speed').addEventListener('input',event=>{
    speed=Number(event.target.value);
    $('speed-label').value=String(speed).padStart(2,'0')+'/10';
    $('speed').setAttribute('aria-valuetext',speed+' 档，'+speed+' 倍速度');
    status();
  });
  $('bell').addEventListener('click',()=>{
    bellTime=performance.now();
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    audio ||=new Audio();
    audio.resume().then(()=>{
      [0,.35,.7].forEach((delay,n)=>{
        [1,2.01,3.96].forEach((harmonic,i)=>{
          const oscillator=audio.createOscillator(), gain=audio.createGain(), start=audio.currentTime+delay;
          oscillator.type='sine';oscillator.frequency.value=[784,1046.5,1174.66][n]*harmonic;
          gain.gain.setValueAtTime(0,start);
          gain.gain.linearRampToValueAtTime(.1/(i+1),start+.008);
          gain.gain.exponentialRampToValueAtTime(.0001,start+2.2);
          oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(start);oscillator.stop(start+2.3);
        });
      });
    }).catch(()=>{});
  });
  document.addEventListener('visibilitychange',()=>{last=null;});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
